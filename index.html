<title>Henry’s Court</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cinzel:wght@600;800&display=swap">
<style>
/* Layout: a green Tudor hall. Header bar on top, one centred stage below. Cream panels hold the words, gilt frames hold the portraits. */
:root{
  --bg:#10261b; --bg2:#17382a; --panel:#f0f2e8; --panel2:#e1e7d4; --ink:#17261d; --muted:#4b5e51;
  --gold:#d2a94b; --gold2:#8f6d1c; --rose:#a8232f; --good:#1f6d3c; --bad:#a3302a; --line:rgba(23,38,29,.2);
  --display:'Cinzel',Georgia,'Times New Roman',serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
html{font-size:18px}
html.big{font-size:24px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background-color:var(--bg); color:#eef2e6; font:400 1rem/1.55 var(--body);
  padding-block:0 3rem;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:linear-gradient(45deg,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(-45deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:44px 44px; min-height:100vh;
}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0 0 .8em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.wrap{max-width:1000px;margin-inline:auto}

/* header */
.top{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;padding-block:.8rem;max-width:1000px;margin-inline:auto}
.brand{display:flex;align-items:center;gap:.5rem;background:none;border:0;cursor:pointer;font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--gold);padding:.2rem}
.brand svg{width:34px;height:34px}
.favour{display:flex;align-items:center;gap:.5rem;font-size:.85rem}
.favour .lbl{font-family:var(--display);color:var(--gold);letter-spacing:.06em;text-transform:uppercase;font-size:.75rem}
.meter{width:130px;height:12px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.meter i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .5s}
.favour b{min-width:2ch;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.08);border:1.5px solid rgba(210,169,75,.6);color:#f4ecd2;border-radius:99px;padding:.3rem .85rem;font-size:.85rem;cursor:pointer;min-height:36px}
.chip:hover{background:rgba(210,169,75,.2)}

/* generic */
.panel{background:var(--panel);color:var(--ink);border-radius:14px;padding:1.2rem 1.4rem;box-shadow:0 10px 28px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.4)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border-radius:10px;border:2px solid transparent;padding:.6em 1.2em;font-weight:700;cursor:pointer;min-height:44px;text-align:center}
.btn.primary{background:var(--gold);color:#241a05}
.btn.primary:hover{background:#e2bb5c}
.btn.ghost{background:transparent;border-color:var(--gold2);color:var(--ink)}
.btn.ghost:hover{background:rgba(143,109,28,.12)}
.btn.onDark{border-color:var(--gold);color:var(--gold)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.9rem}
.row.end{justify-content:flex-end}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.frame{border:5px solid var(--gold);outline:2px solid var(--gold2);border-radius:10px;background:#000;box-shadow:0 8px 20px rgba(0,0,0,.45);overflow:hidden;line-height:0}
.frame svg{width:100%;height:auto;display:block}
.stars{color:var(--gold);letter-spacing:.1em}
.stars .off{color:rgba(120,120,100,.6)}

/* title */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:2rem;align-items:center;padding-block:1.5rem}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);color:var(--gold)}
.hero .sub{font-size:1.2rem;margin:.8rem 0 1.4rem;max-width:34ch}
.namebox{display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end;margin-bottom:.8rem}
.namebox label{display:block;font-size:.85rem;color:var(--gold);margin-bottom:.2rem}
.namebox input{font:inherit;padding:.6em .8em;border-radius:10px;border:2px solid var(--gold);background:#fff;color:var(--ink);min-height:44px;width:15rem;max-width:100%}
.toggles{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;margin:.6rem 0 1rem}
.toggles label{display:flex;align-items:center;gap:.4rem;cursor:pointer}
.toggles input{width:1.15em;height:1.15em;accent-color:var(--gold)}
.heroart{display:grid;gap:1rem;justify-items:center}
.heroart .frame{width:min(100%,260px)}
.roseBig svg{width:110px;height:110px}
.safety{font-size:.8rem;color:#b9c6b5;max-width:48ch}

/* hub */
.hubhead{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:end;margin:.6rem 0 1.2rem}
.hubhead h2{color:var(--gold);font-size:1.7rem}
.hubnav{display:flex;flex-wrap:wrap;gap:.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:1rem}
.chcard{display:flex;flex-direction:column;gap:.35rem;text-align:left;background:rgba(255,255,255,.07);border:2px solid rgba(210,169,75,.5);border-radius:14px;padding:.8rem;cursor:pointer;color:#f4f1e4;min-width:0}
.chcard:hover{background:rgba(255,255,255,.13)}
.chcard .no{font-family:var(--display);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.chcard .ctitle{font-family:var(--display);font-weight:800;font-size:1.02rem;line-height:1.2}
.chcard .cyears{font-size:.85rem;color:#c8d3c4}
.chcard .cstat{font-size:.9rem;font-weight:700}
.chcard.locked{opacity:.55;cursor:not-allowed}
.chcard.locked .frame{filter:grayscale(1) brightness(.7)}
.chcard.done{border-color:var(--gold)}

/* play */
.bar{height:8px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin:.4rem 0 1.2rem}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
.playhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem}
.playhead .ct{font-family:var(--display);color:var(--gold);font-size:1rem}
.scene{display:grid;grid-template-columns:minmax(140px,210px) minmax(0,1fr);gap:1.4rem;align-items:start}
.who{display:grid;gap:.5rem;justify-items:center}
.who .frame{width:100%}
.nameplate{font-family:var(--display);font-size:.8rem;text-align:center;color:var(--gold);letter-spacing:.04em}
.bubble p{font-size:1.08rem}
.datebadge{font-family:var(--display);font-weight:800;font-size:2.2rem;color:var(--rose);line-height:1;margin-bottom:.3rem;font-variant-numeric:tabular-nums}
.q{font-family:var(--display);font-size:1.25rem;font-weight:800;margin-bottom:.8rem}
.tag{display:inline-block;font-size:.75rem;font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--gold);border-radius:6px;padding:.15em .6em;margin-bottom:.6rem}
.opts{display:grid;gap:.55rem}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:.65em .95em;cursor:pointer;min-height:44px}
.opt:hover:not([disabled]){border-color:var(--gold2);background:#fffdf3}
.opt.ok{border-color:var(--good);background:#e0f2e5}
.opt.ok::before{content:"✓ ";font-weight:700;color:var(--good)}
.opt.no{border-color:var(--bad);background:#f8e2df}
.opt.no::before{content:"✗ ";font-weight:700;color:var(--bad)}
.opt.sel{border-color:var(--gold2);background:#fff6d8}
.opt[disabled]{cursor:default}
.fb{margin-top:.9rem;padding:.8rem 1rem;border-radius:10px;background:var(--panel2);border-left:6px solid var(--gold2)}
.fb.good{border-left-color:var(--good)}
.fb.bad{border-left-color:var(--bad)}
.fb b{font-family:var(--display)}
.favchg{font-weight:700}
.favchg.up{color:var(--good)}
.favchg.down{color:var(--bad)}
.voterow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;align-items:center}
.vote{border:2px solid var(--gold2);background:#fff;border-radius:10px;min-height:44px;min-width:76px;padding:.3em .7em;cursor:pointer;font-weight:700;color:var(--ink)}
.slots{display:grid;gap:.45rem;margin-bottom:.9rem}
.slot{display:flex;gap:.7rem;align-items:center;border:2px dashed var(--line);border-radius:10px;padding:.5em .8em;min-height:46px}
.slot .n{font-family:var(--display);font-weight:800;color:var(--gold2);min-width:1.4em}
.slot.filled{border-style:solid;border-color:var(--good);background:#e0f2e5}
.slot .s{margin-left:auto;font-family:var(--display);font-weight:800;color:var(--rose)}
.pool{display:flex;flex-wrap:wrap;gap:.5rem}
.pool .opt{width:auto;flex:1 1 220px}
.cardq{background:#fff;border:2px solid var(--gold2);border-radius:12px;padding:1rem 1.1rem;font-size:1.15rem;margin-bottom:.9rem;min-height:4.5rem;display:flex;align-items:center}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.55rem}
.bucket{background:var(--ink);color:#f6eed0;border:2px solid var(--gold);border-radius:10px;padding:.6em .8em;cursor:pointer;text-align:left;min-height:44px}
.bucket b{display:block;font-family:var(--display)}
.bucket span{font-size:.8rem;opacity:.85}
.bucket:hover:not([disabled]){background:#24402f}
.bucket[disabled]{opacity:.45;cursor:default}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.6rem 1rem}
.cols .opt{font-size:.95rem}
.opt.done{border-color:var(--good);background:#e0f2e5;opacity:.8}
.opt.done::before{content:"✓ ";color:var(--good);font-weight:700}
.dots{display:flex;gap:.3rem;margin:.2rem 0 .8rem}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold2)}
.reward{display:grid;grid-template-columns:minmax(130px,200px) minmax(0,1fr);gap:1.2rem;align-items:start}
.fate{display:inline-block;background:var(--rose);color:#fff;font-family:var(--display);font-weight:800;padding:.2em .8em;border-radius:6px;margin:.3rem 0 .6rem}
.reward ul{margin:.2rem 0 .8rem;padding-left:1.2rem}
.reward li{margin-bottom:.25rem}

/* result */
.cert{border:4px double var(--gold2);border-radius:10px;padding:1.4rem 1rem;text-align:center;background:#fbfaf0}
.cert h2{font-size:1.9rem;color:var(--rose)}
.cert .rank{font-family:var(--display);font-size:1.6rem;font-weight:800;margin:.5rem 0}
.cert svg{width:70px;height:70px}
.stats{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:.8rem}
.stat{background:var(--panel2);border-radius:10px;padding:.5rem 1rem;min-width:7rem}
.stat b{display:block;font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}

/* modal */
.modal{position:fixed;inset:0;background:rgba(4,14,9,.78);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(740px,100%);max-height:100%;overflow:auto}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.8rem}
.sheethead h2{font-size:1.4rem}
.sheet .chip{background:var(--ink);color:#f6eed0}
.tl{list-style:none;margin:0;padding:0;border-left:3px solid var(--gold2)}
.tl li{position:relative;padding:.35rem 0 .35rem 1.2rem;display:grid;grid-template-columns:3.6rem minmax(0,1fr);gap:.5rem}
.tl li::before{content:"";position:absolute;left:-8px;top:.85rem;width:13px;height:13px;border-radius:50%;background:var(--gold2);border:2px solid var(--panel)}
.tl li.lock{opacity:.5}
.tl li.lock::before{background:var(--panel2);border-color:var(--gold2)}
.tl .y{font-family:var(--display);font-weight:800;color:var(--rose);font-variant-numeric:tabular-nums}
.wordlist{display:grid;gap:.5rem}
.wordlist div{padding:.5rem .8rem;background:#fff;border-radius:8px;border:1px solid var(--line)}
.wordlist b{font-family:var(--display)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.8rem}
.gallery figure{margin:0;text-align:center;font-size:.85rem}
.gallery figcaption b{display:block;font-family:var(--display)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-size:.8rem}
.scroll{overflow-x:auto}
textarea{width:100%;font:inherit;font-size:.85rem;padding:.5rem;border-radius:8px;border:1px solid var(--line);min-height:6rem;background:#fff;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:#f6eed0;border:2px solid var(--gold);border-radius:10px;padding:.55em 1.1em;z-index:60;max-width:90vw;text-align:center}
.term{background:none;border:0;border-bottom:2px dotted var(--gold2);color:inherit;font:inherit;padding:0;cursor:help;font-weight:700}
.defn{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));z-index:55}
.defn b{font-family:var(--display);text-transform:capitalize}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none;outline:3px solid var(--bad)}.meter i,.bar i{transition:none}}

@media (max-width:700px){
  .hero{grid-template-columns:1fr}
  .heroart{order:-1}
  .heroart .frame{width:150px}
  .roseBig{display:none}
  .scene,.reward{grid-template-columns:1fr}
  .who{max-width:140px;margin-inline:auto}
  .reward .frame{max-width:150px}
  .cols{grid-template-columns:1fr}
  .meter{width:90px}
}
</style>

<header class="top" id="top">
  <button class="brand" data-act="home" aria-label="Go to the start"><span id="brandrose"></span><span>Henry’s Court</span></button>
  <div class="favour" id="favour" hidden><span class="lbl">Favour</span><div class="meter" role="progressbar" aria-label="Favour with the king" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30"><i></i></div><b id="favnum">30</b></div>
  <nav class="tools" aria-label="Tools">
    <button class="chip" data-act="modal" data-arg="timeline">Timeline</button>
    <button class="chip" data-act="modal" data-arg="words">Words</button>
    <button class="chip" data-act="modal" data-arg="settings">Settings</button>
  </nav>
</header>
<main id="app" class="wrap"></main>
<div id="modal" class="modal" hidden>
  <div class="sheet panel" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="sheethead"><h2 id="mt"></h2><button class="chip" data-act="close">Close</button></div>
    <div id="mb"></div>
  </div>
</div>
<div id="defn" class="defn panel" role="status" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript>This game needs JavaScript. Please turn it on in your browser.</noscript>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function fmt(s){
  return s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,k,d)=>'<button type="button" class="term" data-term="'+k.toLowerCase()+'">'+(d||k)+'</button>')
          .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}
function plain(s){return s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,k,d)=>d||k).replace(/\*\*/g,'');}

/* ---------- glossary ---------- */
const GL={
 'court':'The king’s household: his family, advisers, servants and friends.',
 'jester':'An entertainer at court who made people laugh. A jester could sometimes say things nobody else dared to.',
 'wars of the roses':'A long struggle (1455–1487) between two branches of the royal family, Lancaster (red rose) and York (white rose), over who should be king.',
 'heir':'The person who is next in line to inherit the throne.',
 'dispensation':'Special permission from the Pope to break a Church rule.',
 'civil war':'A war between groups of people inside the same country.',
 'pope':'The leader of the Catholic Church, who lives in Rome.',
 'annulment':'An official ruling that a marriage was never valid in law. It is not quite the same as a divorce.',
 'lady-in-waiting':'A woman who served and kept company with the queen.',
 'act of supremacy':'A law of 1534 that made the king, not the Pope, head of the Church in England.',
 'reformation':'A great change in 1500s Europe when many Christians broke away from the Pope and the Catholic Church.',
 'treason':'The crime of betraying your king or country. In Tudor times the punishment could be death.',
 'monastery':'A building where monks live, pray and work. Many owned lots of land and treasure.',
 'dissolution':'Closing something down. Between 1536 and 1540 Henry closed all of England’s monasteries.',
 'alliance':'An agreement between countries to help and protect each other.',
 'primary source':'Something made at the time you are studying, such as a portrait, a letter or a diary.',
 'propaganda':'Pictures or words made to change what people think, not just to tell the truth.',
 'bias':'Showing support for one side without being fair.',
 'regent':'Someone who rules the country for a king who is away, ill or too young.',
 'succession':'Who will be the next king or queen, and in what order.',
 'evidence':'Facts or sources that help show whether something is true.',
 'parliament':'A group of people who help to make a country’s laws. Henry needed Parliament to pass his big changes.'
};

/* ---------- portraits ---------- */
const P={
 will:{bg:'#7a2a35',skin:'#f0c9a6',hair:'#5a3a22',hat:'jester',dress:'#d2a94b',trim:'#a8232f',mood:'grin'},
 henryY:{bg:'#26493a',skin:'#f4d0b0',hair:'#b8582a',hat:'bonnet',dress:'#7a1f2b',trim:'#d2a94b',mood:'smile',chain:1},
 henry:{bg:'#26493a',skin:'#f1c6a2',hair:'#a2461f',hat:'bonnet',dress:'#7a1f2b',trim:'#d2a94b',mood:'neutral',beard:1,broad:1,chain:1,fur:1},
 cathA:{bg:'#3c3552',skin:'#f1cfb0',hair:'#6d4326',hat:'gable',hood:'#1c1c22',dress:'#3b2a63',trim:'#d2a94b',mood:'smile'},
 anneB:{bg:'#2d2c3e',skin:'#e8c19d',hair:'#2a1b15',hat:'french',hood:'#1c1c22',dress:'#1d1d26',trim:'#d2a94b',mood:'smile',B:1},
 jane:{bg:'#47546b',skin:'#f6dcc3',hair:'#cfa86a',hat:'gable',hood:'#f4f1e6',dress:'#c9d3e6',trim:'#d2a94b',mood:'smile'},
 anneC:{bg:'#2f5a45',skin:'#efc9a8',hair:'#74472b',hat:'cleves',hood:'#14281e',dress:'#2c6a4a',trim:'#d2a94b',mood:'smile'},
 cathH:{bg:'#5a2430',skin:'#f6d6bc',hair:'#8a3f22',hat:'french',hood:'#7a1f2b',dress:'#a8232f',trim:'#d2a94b',mood:'worried'},
 cathP:{bg:'#4d3a1d',skin:'#f1cdb0',hair:'#a85b2b',hat:'french',hood:'#d2a94b',dress:'#9c6b1a',trim:'#f4ecd2',mood:'smile'},
 edward:{bg:'#3a4f7a',skin:'#f6d9bf',hair:'#d9ac62',hat:'bonnet',dress:'#2d4f9a',trim:'#d2a94b',mood:'smile'},
 mary:{bg:'#43263b',skin:'#f1d0b4',hair:'#4a2a1d',hat:'french',hood:'#1c1c22',dress:'#6b1f3c',trim:'#d2a94b',mood:'neutral'},
 elizabeth:{bg:'#2a3f5e',skin:'#f8e1cc',hair:'#c2461c',hat:'crown',dress:'#e9e4d3',trim:'#d2a94b',mood:'smile',long:1}
};
const NAMES={will:'Will Somers, jester',henryY:'Prince Henry',henry:'King Henry VIII',cathA:'Catherine of Aragon',anneB:'Anne Boleyn',jane:'Jane Seymour',anneC:'Anne of Cleves',cathH:'Catherine Howard',cathP:'Catherine Parr',edward:'Edward VI',mary:'Mary I',elizabeth:'Elizabeth I'};
function portrait(key){
  const p=P[key],sk=p.skin,hr=p.hair,tr=p.trim,hd=p.hood||'#1c1c22';let s='';
  s+='<rect width="120" height="140" fill="'+p.bg+'"/><path d="M0 0L120 140M120 0L0 140" stroke="#fff" stroke-opacity=".06"/>';
  if(p.hat==='french') s+='<path d="M30 52Q22 100 32 126L44 126Q38 96 41 64Z" fill="#14141a"/><path d="M90 52Q98 100 88 126L76 126Q82 96 79 64Z" fill="#14141a"/>';

CH[0].no='Prologue';CH.forEach((c,i)=>{if(i>0&&i<7)c.no='Chapter '+i;});CH[7].no='Finale';

/* ---------- state ---------- */
const KEY='henrysCourt.v1',BKEY='henrysCourt.board.v1';
const fresh=()=>({name:'',favour:30,prog:{},tl:[],words:[],settings:{tts:false,big:false,unlock:false}});
let S=fresh(),board=[];
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S=Object.assign(fresh(),o);S.settings=Object.assign(fresh().settings,o.settings||{});}}catch(e){}
try{const r=localStorage.getItem(BKEY);if(r)board=JSON.parse(r)||[];}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const saveBoard=()=>{try{localStorage.setItem(BKEY,JSON.stringify(board));}catch(e){}};

let view='title',run=null,cur={on(){}},lastFocus=null;
const app=$('#app');
const unlocked=i=>S.settings.unlock||i===0||!!(S.prog[i-1]&&S.prog[i-1].done);
const starStr=n=>'<span class="stars" aria-label="'+n+' of 3 stars">'+'★'.repeat(n)+'<span class="off">'+'★'.repeat(3-n)+'</span></span>';
const rankOf=f=>f>=90?'Henry’s Most Trusted Advisor':f>=70?'Royal Counsellor':f>=50?'Court Favourite':f>=30?'Keen Young Page':'Apprentice Scribe';
const curFav=()=>clamp(S.favour+(run?run.fav:0),0,100);

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},2600);}
function updateMeter(){
  const f=curFav(),show=view!=='title';
  $('#favour').hidden=!show;
  $('#favour .meter i').style.width=f+'%';
  $('#favour .meter').setAttribute('aria-valuenow',f);
  $('#favnum').textContent=f;
}
function applyTheme(){document.documentElement.classList.toggle('big',!!S.settings.big);}
function unlockEv(ev){if(!ev)return;(Array.isArray(ev)?ev:[ev]).forEach(e=>{if(!S.tl.includes(e))S.tl.push(e);});save();}
function speak(text){
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(plain(text));u.lang='en-GB';u.rate=.95;speechSynthesis.speak(u);
  }catch(e){}
}
const canSpeak=()=>{try{return 'speechSynthesis' in window;}catch(e){return false;}};

/* ---------- scoring ---------- */
function record(level,label){
  run.total++;
  if(level==='full'){run.ok+=1;run.fav+=4;}
  else if(level==='part'){run.ok+=.5;run.fav+=2;}
  else{run.fav-=2;run.missed.push(label);}
  updateMeter();
}
const levelFor=(mist,n)=>mist===0?'full':mist<=Math.max(2,Math.ceil(n/3))?'part':'miss';

/* ---------- views ---------- */
function titleView(){
  const has=S.name&&Object.keys(S.prog).length>0;

  '<section class="hero"><div>'+

    '<p class="sub">Advise a king, meet his six wives and try to keep your head.</p>'+

    '<button class="btn primary" data-act="start">'+(has?'Continue':'Start')+'</button>'+
    (has?'<button class="btn ghost onDark" data-act="newplayer">New player</button>':'')+'</div>'+
    '<div class="toggles">'+
      '<label><input type="checkbox" id="tg-big" '+(S.settings.big?'checked':'')+' data-act="tgbig"> Whiteboard mode (big text and class voting)</label>'+
      (canSpeak()?'<label><input type="checkbox" id="tg-tts" '+(S.settings.tts?'checked':'')+' data-act="tgtts"> Read stories aloud</label>':'')+
    '</div>'+
    '<div class="row" style="margin-top:0"><button class="chip" data-act="modal" data-arg="board">Class board</button><button class="chip" data-act="modal" data-arg="teacher">Teacher area</button></div>'+
    '<p class="safety" style="margin-top:1rem">For Year 6 (KS2 History: the Tudors). Your progress is saved on this device only. Nothing is sent anywhere and nobody needs an account.</p>'+
  '</div><div class="heroart"><div class="roseBig">'+rose(110)+'</div>'+pf('henry')+'</div></section>';
}
function hubView(){
  const done=Object.values(S.prog).filter(p=>p.done).length;
  app.innerHTML=
  '<div class="hubhead"><div><h2>The Great Hall</h2><p class="muted" style="color:#c8d3c4;margin:.2rem 0 0">Welcome, '+esc(S.name||'Advisor')+'. Your rank: <b style="color:var(--gold)">'+rankOf(S.favour)+'</b> · '+done+' of 8 chapters done</p></div>'+
  '<div class="hubnav"><button class="chip" data-act="modal" data-arg="gallery">Royal gallery</button><button class="chip" data-act="modal" data-arg="board">Class board</button><button class="chip" data-act="modal" data-arg="teacher">Teacher area</button></div></div>'+
  '<div class="grid">'+CH.map((c,i)=>{
    const lock=!unlocked(i),p=S.prog[i];
    return '<button class="chcard '+(lock?'locked':'')+(p&&p.done?' done':'')+'" data-act="open" data-arg="'+i+'" '+(lock?'aria-disabled="true"':'')+'>'+
      pf(c.who)+'<span class="no">'+c.no+'</span><span class="ctitle">'+c.title+'</span><span class="cyears">'+c.years+'</span>'+
      '<span class="cstat">'+(lock?'🔒 Locked':p&&p.done?starStr(p.stars):'Ready to play')+'</span></button>';
  }).join('')+'</div>';
}
function playView(){
  const c=CH[run.ch];
  app.innerHTML=
  '<div class="playhead"><div class="ct">'+c.no+': '+c.title+'</div><button class="chip" data-act="leave">Leave chapter</button></div>'+
  '<div class="bar" aria-hidden="true"><i id="pbar"></i></div><div id="stage"></div>';
  renderStep();
}
function renderStep(){
  const st=CH[run.ch].steps[run.i];
  $('#pbar').style.width=Math.round(run.i/CH[run.ch].steps.length*100)+'%';
  const stage=$('#stage');
  ({story:sStory,decision:sDecision,quiz:sQuiz,order:sOrder,sort:sSort,match:sMatch,reflect:sReflect,reward:sReward,result:sResult})[st.t](stage,st);
  window.scrollTo(0,0);
  updateMeter();
}
const next=()=>{run.i++;renderStep();};
const stepsOf=()=>CH[run.ch].steps;

/* ---------- step renderers ---------- */
function sStory(el,st){
  unlockEv(st.ev);
  const canBack=run.i>0&&stepsOf()[run.i-1].t==='story';
  el.innerHTML='<div class="scene"><div class="who">'+pf(st.who)+'<div class="nameplate">'+NAMES[st.who]+'</div></div>'+
   '<div class="bubble panel">'+(st.date?'<div class="datebadge">'+st.date+'</div>':'')+'<p>'+fmt(st.text)+'</p>'+
   '<div class="row">'+(canBack?'<button class="btn ghost" data-act="s" data-arg="back">← Back</button>':'')+
   (canSpeak()?'<button class="btn ghost" data-act="s" data-arg="speak">🔊 Read aloud</button>':'')+
   '<button class="btn primary" data-act="s" data-arg="next" style="margin-left:auto">Next →</button></div></div></div>';
  cur={on(a){if(a==='next')next();else if(a==='back'){run.i--;renderStep();}else if(a==='speak')speak(st.text);}};
  if(S.settings.tts)speak(st.text);
}
function sDecision(el,st){
  const votes=st.opts.map(()=>0),big=S.settings.big;let done=false;
  const draw=()=>{
    el.innerHTML='<div class="scene"><div class="who">'+pf(st.who)+'<div class="nameplate">'+NAMES[st.who]+'</div></div><div class="panel">'+
     '<span class="tag">Decision</span><div class="q">'+fmt(st.q)+'</div><div class="opts">'+
     st.opts.map((o,i)=>'<div class="'+(big?'voterow':'')+'"><button class="opt" data-act="s" data-arg="pick" data-i="'+i+'">'+fmt(o.l)+'</button>'+
       (big?'<button class="vote" data-act="s" data-arg="vote" data-i="'+i+'" aria-label="Add a vote">🗳 '+votes[i]+'</button>':'')+'</div>').join('')+'</div>'+
     (big?'<div class="row"><button class="btn ghost" data-act="s" data-arg="top">Pick the class’s top choice</button><button class="btn ghost" data-act="s" data-arg="reset">Reset votes</button></div><p class="small muted" id="votemsg" style="margin:.5rem 0 0">Class vote: tap 🗳 for each hand raised, then pick the winner.</p>':'')+
     '<div id="fbk"></div></div></div>';
  };
  draw();
  const pick=i=>{
    if(done)return;done=true;
    const o=st.opts[i];run.fav+=o.fav;updateMeter();
    $('#fbk').innerHTML='<div class="fb '+(o.fav>=0?'good':'bad')+'"><b>What happened in history</b><p style="margin:.3rem 0">'+fmt(o.res)+'</p>'+
      '<p class="favchg '+(o.fav>=0?'up':'down')+'" style="margin:0">Favour '+(o.fav>=0?'+':'')+o.fav+'</p></div><div class="row end"><button class="btn primary" data-act="s" data-arg="next">Continue →</button></div>';
    el.querySelectorAll('.opt,.vote').forEach((b,j)=>{b.disabled=true;if(b.classList.contains('opt')&&b.dataset.i==i)b.classList.add('sel');});
  };
  cur={on(a,b){
    if(a==='pick')pick(+b.dataset.i);
    else if(a==='vote'&&!done){votes[+b.dataset.i]++;b.innerHTML='🗳 '+votes[+b.dataset.i];}
    else if(a==='reset'&&!done){votes.fill(0);el.querySelectorAll('.vote').forEach(v=>v.innerHTML='🗳 0');}
    else if(a==='top'&&!done){const m=Math.max.apply(null,votes),w=votes.map((v,i)=>v===m?i:-1).filter(i=>i>=0);
      if(m===0||w.length>1){$('#votemsg').textContent=m===0?'No votes yet. Count hands first.':'It’s a tie. Discuss, then vote again.';}
      else pick(w[0]);}
    else if(a==='next')next();
  }};
}
function optButtons(items){return items.map((o,i)=>'<button class="opt" data-act="s" data-arg="o" data-i="'+i+'">'+fmt(o.t)+'</button>').join('');}
function sQuiz(el,st){
  const opts=shuffle(st.opts.map((t,i)=>({t,c:i===st.ans}))),n=opts.length;let tries=0,over=false;
  el.innerHTML='<div class="scene"><div class="who">'+pf('will')+'<div class="nameplate">'+NAMES.will+'</div></div><div class="panel"><span class="tag">Question</span><div class="q">'+fmt(st.q)+'</div>'+
   '<div class="opts">'+optButtons(opts)+'</div><div id="fbk" aria-live="polite"></div></div></div>';
  cur={on(a,b){
    if(a==='next'){next();return;}
    if(a!=='o'||over)return;
    const o=opts[+b.dataset.i];
    if(o.c){
      over=true;b.classList.add('ok');lock();
      const lvl=tries===0?'full':'part';record(lvl,st.label);
      $('#fbk').innerHTML='<div class="fb good"><b>'+(tries===0?'Well done!':'You got there!')+'</b><p style="margin:.3rem 0">'+fmt(st.why)+'</p></div><div class="row end"><button class="btn primary" data-act="s" data-arg="next">Next →</button></div>';
    }else{
      tries++;b.classList.add('no','shake');b.disabled=true;
      if(tries>=2||tries>=n-1){
        over=true;lock();el.querySelectorAll('.opt').forEach((x,i)=>{if(opts[i].c)x.classList.add('ok');});
        record('miss',st.label);
        $('#fbk').innerHTML='<div class="fb bad"><b>The answer was shown</b><p style="margin:.3rem 0">'+fmt(st.why)+'</p></div><div class="row end"><button class="btn primary" data-act="s" data-arg="next">Next →</button></div>';
      }else $('#fbk').innerHTML='<div class="fb bad"><b>Not quite.</b> <span>Hint: '+fmt(st.hint||'Read the question again.')+'</span></div>';
    }
  }};
  function lock(){el.querySelectorAll('.opt').forEach(x=>x.disabled=true);}
}
function sOrder(el,st){
  const n=st.items.length,pool=shuffle(st.items.map((it,i)=>({it,i}))),placed=[];let mist=0,over=false;
  const draw=()=>{
    el.innerHTML='<div class="scene"><div class="who">'+pf('will')+'<div class="nameplate">'+NAMES.will+'</div></div><div class="panel"><span class="tag">Put in order</span><div class="q">'+fmt(st.q)+'</div>'+
     '<div class="slots">'+st.items.map((it,k)=>{const p=placed[k];return '<div class="slot'+(p?' filled':'')+'"><span class="n">'+(k+1)+'</span><span>'+(p?fmt(p.it.t):'')+'</span>'+(p&&p.it.s?'<span class="s">'+p.it.s+'</span>':'')+'</div>';}).join('')+'</div>'+
     (over?'':'<div class="pool">'+pool.filter(p=>!placed.includes(p)).map(p=>'<button class="opt" data-act="s" data-arg="o" data-i="'+p.i+'">'+fmt(p.it.t)+'</button>').join('')+'</div>')+
     '<div id="fbk" aria-live="polite"></div></div></div>';
  };
  draw();
  cur={on(a,b){
    if(a==='next'){next();return;}
    if(a!=='o'||over)return;
    const idx=+b.dataset.i,k=placed.length;
    if(idx===k){
      placed.push(pool.find(p=>p.i===idx));
      if(placed.length===n){
        over=true;const lvl=levelFor(mist,n);record(lvl,st.label);draw();
        $('#fbk').innerHTML='<div class="fb good"><b>'+(mist===0?'Perfect order!':'All in place.')+'</b><p style="margin:.3rem 0">'+fmt(st.why)+'</p></div><div class="row end"><button class="btn primary" data-act="s" data-arg="next">Next →</button></div>';
      }else{draw();$('#fbk').innerHTML='';}
    }else{
      mist++;b.classList.add('no','shake');
      const f=$('#fbk');f.innerHTML='<div class="fb bad"><b>Not that one yet.</b> '+(mist>=2?'Hint: '+fmt(st.hint||''):'Think again about what comes next.')+'</div>';
      setTimeout(()=>b.classList.remove('no','shake'),500);
    }
  }};
}
function sSort(el,st){
  const cards=shuffle(st.cards);let k=0,mist=0,waiting=false;
  const draw=()=>{
    const c=cards[k];
    el.innerHTML='<div class="scene"><div class="who">'+pf('will')+'<div class="nameplate">'+NAMES.will+'</div></div><div class="panel"><span class="tag">Sort it</span><div class="q">'+fmt(st.q)+'</div>'+
     '<div class="dots" aria-label="Card '+(k+1)+' of '+cards.length+'">'+cards.map((x,i)=>'<i class="'+(i<=k?'on':'')+'"></i>').join('')+'</div>'+
     '<div class="cardq">'+fmt(c.t)+'</div><div class="buckets">'+st.buckets.map(b=>'<button class="bucket" data-act="s" data-arg="b" data-b="'+b.id+'"><b>'+b.l+'</b><span>'+b.d+'</span></button>').join('')+'</div><div id="fbk" aria-live="polite"></div></div></div>';
    waiting=false;
  };
  draw();
  cur={on(a,b){
    if(a==='next'){
      if(k<cards.length-1){k++;draw();}
      else{const lvl=levelFor(mist,cards.length);record(lvl,st.label);next();}
      return;
    }
    if(a!=='b'||waiting)return;
    const c=cards[k];
    if(b.dataset.b===c.b){
      waiting=true;el.querySelectorAll('.bucket').forEach(x=>x.disabled=true);
      $('#fbk').innerHTML='<div class="fb good"><b>Correct.</b><p style="margin:.3rem 0">'+fmt(c.why)+'</p></div><div class="row end"><button class="btn primary" data-act="s" data-arg="next">'+(k<cards.length-1?'Next card →':'Finish →')+'</button></div>';
    }else{
      mist++;b.classList.add('shake');
      $('#fbk').innerHTML='<div class="fb bad"><b>Not quite.</b> Try a different label.</div>';
      setTimeout(()=>b.classList.remove('shake'),500);
    }
  }};
}
function sMatch(el,st){
  const L=st.pairs.map((p,i)=>({t:p[0],i})),R=shuffle(st.pairs.map((p,i)=>({t:p[1],i})));
  let sel=null,mist=0,left=st.pairs.length;const doneL=new Set(),doneR=new Set();
  const draw=()=>{
    el.innerHTML='<div class="scene"><div class="who">'+pf('will')+'<div class="nameplate">'+NAMES.will+'</div></div><div class="panel"><span class="tag">Match</span><div class="q">'+fmt(st.q)+'</div>'+
     '<div class="cols"><div class="opts">'+L.map(x=>'<button class="opt '+(doneL.has(x.i)?'done':sel===x.i?'sel':'')+'" data-act="s" data-arg="l" data-i="'+x.i+'" '+(doneL.has(x.i)?'disabled':'')+'>'+fmt(x.t)+'</button>').join('')+'</div>'+
     '<div class="opts">'+R.map(x=>'<button class="opt '+(doneR.has(x.i)?'done':'')+'" data-act="s" data-arg="r" data-i="'+x.i+'" '+(doneR.has(x.i)?'disabled':'')+'>'+fmt(x.t)+'</button>').join('')+'</div></div><div id="fbk" aria-live="polite"></div></div></div>';
  };
  draw();
  cur={on(a,b){
    if(a==='next'){next();return;}
    if(a==='l'){sel=+b.dataset.i;draw();return;}
    if(a==='r'){
      if(sel===null){$('#fbk').innerHTML='<div class="fb"><b>Tap an item on the left first.</b></div>';return;}
      const i=+b.dataset.i;
      if(i===sel){
        doneL.add(i);doneR.add(i);sel=null;left--;draw();
        if(left===0){const lvl=levelFor(mist,st.pairs.length);record(lvl,st.label);
          $('#fbk').innerHTML='<div class="fb good"><b>All matched!</b><p style="margin:.3rem 0">'+fmt(st.why)+'</p></div><div class="row end"><button class="btn primary" data-act="s" data-arg="next">Next →</button></div>';}
      }else{
        mist++;b.classList.add('no','shake');
        $('#fbk').innerHTML='<div class="fb bad"><b>Not a match.</b> Try again.</div>';
        setTimeout(()=>b.classList.remove('no','shake'),500);
      }
    }
  }};
}
function sReflect(el,st){
  el.innerHTML='<div class="scene"><div class="who">'+pf('will')+'<div class="nameplate">'+NAMES.will+'</div></div><div class="panel"><span class="tag">Talk about it</span><div class="q">'+fmt(st.q)+'</div>'+
   '<p class="muted">Think, then share with a partner.</p><ul>'+st.pts.map(p=>'<li>'+fmt(p)+'</li>').join('')+'</ul>'+
   '<div class="row end"><button class="btn primary" data-act="s" data-arg="next">Next →</button></div></div></div>';
  cur={on(a){if(a==='next')next();}};
}
function stars(){const a=run.total?run.ok/run.total:1;return a>=.85?3:a>=.5?2:1;}
function finish(){
  if(run.done)return;run.done=true;
  const old=S.prog[run.ch];if(old)S.favour=clamp(S.favour-old.fav,0,100);
  S.favour=clamp(S.favour+run.fav,0,100);
  S.prog[run.ch]={done:true,stars:stars(),ok:run.ok,total:run.total,fav:run.fav,missed:run.missed.slice()};
  save();
}
function sReward(el,st){
  const c=st.card;finish();
  el.innerHTML='<div class="panel"><span class="tag">Royal portrait card earned</span><div class="reward">'+pf(c.who)+'<div><h2>'+c.name+'</h2><div class="muted">'+c.line+'</div><span class="fate">'+c.fate+'</span>'+
   '<ul>'+c.facts.map(f=>'<li>'+f+'</li>').join('')+'</ul>'+
   '<p>Chapter score: '+starStr(S.prog[run.ch].stars)+' &nbsp; Favour this chapter: <b class="favchg '+(run.fav>=0?'up':'down')+'">'+(run.fav>=0?'+':'')+run.fav+'</b></p>'+
   (run.missed.length?'<p class="small muted">Worth another look: '+run.missed.map(esc).join(', ')+'.</p>':'')+
   '<div class="row"><button class="btn primary" data-act="s" data-arg="hall">Back to the Great Hall</button></div></div></div></div>';
  cur={on(a){if(a==='hall'){view='hub';run=null;render();}}};
}
function sResult(el){
  finish();
  const total=Object.values(S.prog).reduce((a,p)=>a+(p.stars||0),0),f=S.favour,r=rankOf(f);
  const mine=board.find(b=>b.name===S.name);
  const entry={name:S.name||'Advisor',favour:f,stars:total,date:new Date().toISOString().slice(0,10)};
  if(mine)Object.assign(mine,entry);else board.push(entry);
  board.sort((a,b)=>b.favour-a.favour||b.stars-a.stars);board=board.slice(0,30);saveBoard();
  el.innerHTML='<div class="panel"><div class="cert">'+rose(70)+'<h2>Certificate of Service</h2><p>This is to certify that</p><div class="rank" style="color:var(--ink)">'+esc(S.name||'Advisor')+'</div><p>has served King Henry VIII and earned the rank of</p><div class="rank">'+r+'</div>'+
   '<div class="stats"><div class="stat"><b>'+f+'</b>Favour</div><div class="stat"><b>'+total+' / 24</b>Stars</div><div class="stat"><b>'+Object.values(S.prog).filter(p=>p.done).length+' / 8</b>Chapters</div></div></div>'+
   '<p class="small muted" style="margin-top:.8rem">Want to keep this? Take a screenshot of the certificate.</p>'+
   '<div class="row"><button class="btn primary" data-act="s" data-arg="hall">Back to the Great Hall</button><button class="btn ghost" data-act="s" data-arg="board">Class board</button><button class="btn ghost" data-act="s" data-arg="again">Next player</button></div></div>';
  cur={on(a){
    if(a==='hall'){view='hub';run=null;render();}
    else if(a==='board')openModal('board');
    else if(a==='again')acts.newplayer();
  }};
}

/* ---------- modals ---------- */
function openModal(kind){
  const m=$('#modal'),mt=$('#mt'),mb=$('#mb');lastFocus=document.activeElement;
  if(kind==='timeline'){
    mt.textContent='Tudor timeline';
    mb.innerHTML='<p class="muted">Events unlock as you play.</p><ul class="tl">'+TL.map(e=>{const u=S.tl.includes(e[0]);return '<li class="'+(u?'':'lock')+'"><span class="y">'+e[1]+'</span><span>'+(u?e[2]:'??? Keep playing to find out.')+'</span></li>';}).join('')+'</ul>';
  }else if(kind==='words'){
    mt.textContent='Word bank';
    const w=S.words;
    mb.innerHTML='<p class="muted">Tap any underlined word in the game to add it here.</p>'+(w.length?'<div class="wordlist">'+w.map(k=>'<div><b>'+k+'</b><br>'+GL[k]+'</div>').join('')+'</div>':'<p>You haven’t collected any words yet.</p>')+
      '<details style="margin-top:1rem"><summary>See every word</summary><div class="wordlist" style="margin-top:.5rem">'+Object.keys(GL).map(k=>'<div><b>'+k+'</b><br>'+GL[k]+'</div>').join('')+'</div></details>';
  }else if(kind==='settings'){
    mt.textContent='Settings';
    mb.innerHTML='<div class="toggles" style="flex-direction:column">'+
     '<label><input type="checkbox" id="s-big" data-act="tgbig" '+(S.settings.big?'checked':'')+'> Whiteboard mode: bigger text and class voting on decisions</label>'+
     (canSpeak()?'<label><input type="checkbox" id="s-tts" data-act="tgtts" '+(S.settings.tts?'checked':'')+'> Read each story aloud automatically</label>':'')+
     '<label><input type="checkbox" id="s-unlock" data-act="tgunlock" '+(S.settings.unlock?'checked':'')+'> Teacher: unlock every chapter</label></div>';
  }else if(kind==='gallery'){
    mt.textContent='Royal gallery';
    const got=CH.map((c,i)=>({c,i})).filter(x=>S.prog[x.i]&&S.prog[x.i].done&&x.c.steps.find(s=>s.t==='reward'));
    mb.innerHTML=got.length?'<div class="gallery">'+got.map(x=>{const cd=x.c.steps.find(s=>s.t==='reward').card;return '<figure>'+pf(cd.who)+'<figcaption><b>'+cd.name+'</b>'+cd.fate+'</figcaption></figure>';}).join('')+'</div>':'<p>Finish a chapter to earn your first portrait card.</p>';
  }else if(kind==='board'){
    mt.textContent='Class board';
    mb.innerHTML=board.length?'<div class="scroll"><table><thead><tr><th>#</th><th>Name</th><th>Favour</th><th>Stars</th><th>Date</th></tr></thead><tbody>'+board.map((b,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(b.name)+'</td><td>'+b.favour+'</td><td>'+b.stars+'</td><td>'+b.date+'</td></tr>').join('')+'</tbody></table></div><p class="small muted">Saved on this device only. Players are added when they finish the Finale.</p>':'<p>No scores yet. Finish the Finale to join the board.</p>';
  }else if(kind==='teacher'){
    mt.textContent='Teacher area';
    const rows=CH.map((c,i)=>{const p=S.prog[i];return '<tr><td>'+c.no+': '+c.title+'</td><td>'+(p&&p.done?starStr(p.stars):'–')+'</td><td>'+(p&&p.done&&p.total?Math.round(p.ok/p.total*100)+'%':'–')+'</td><td>'+(p&&p.missed&&p.missed.length?p.missed.map(esc).join('; '):'')+'</td></tr>';}).join('');
    const sum=(S.name||'Player')+' — Favour '+S.favour+' ('+rankOf(S.favour)+')\n'+CH.map((c,i)=>{const p=S.prog[i];return c.no+': '+(p&&p.done?p.stars+' stars, '+(p.total?Math.round(p.ok/p.total*100):100)+'%'+(p.missed.length?' — revisit: '+p.missed.join('; '):''):'not done');}).join('\n');
    mb.innerHTML='<p><b>Player:</b> '+esc(S.name||'none yet')+' · <b>Favour:</b> '+S.favour+'</p><div class="scroll"><table><thead><tr><th>Chapter</th><th>Stars</th><th>Score</th><th>Revisit</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
     '<p style="margin-top:.8rem"><b>Curriculum links.</b> KS2 History: a study of an aspect or theme in British history that extends chronological knowledge beyond 1066. Chronology, cause and consequence, using sources, and historical vocabulary. Also Y6 maths (ages and date gaps) and reading comprehension.</p>'+
     '<p><b>Using it in class.</b> Turn on Whiteboard mode for big text. On decision screens, tap 🗳 once for each hand raised, then pick the class’s top choice. Each chapter ends with “Talk about it” prompts for partner discussion.</p>'+
     '<label for="sumtxt" class="small">Summary to copy</label><textarea id="sumtxt" readonly>'+esc(sum)+'</textarea>'+
     '<div class="row"><button class="btn ghost" data-act="copysum">Copy summary</button><button class="btn ghost" data-act="tgunlock2">'+(S.settings.unlock?'Re-lock chapters':'Unlock every chapter')+'</button><button class="btn ghost" data-act="clearboard">Clear class board</button></div><div id="tmsg" class="small" aria-live="polite"></div>';
  }
  m.hidden=false;
  const f=m.querySelector('button,input');if(f)f.focus();
}
function closeModal(){$('#modal').hidden=true;try{if(lastFocus&&lastFocus.focus)lastFocus.focus();}catch(e){}}
function showDefn(k){
  const d=$('#defn');if(!GL[k])return;
  if(!S.words.includes(k)){S.words.push(k);save();}
  d.innerHTML='<b>'+k+'</b><p style="margin:.3rem 0 .5rem">'+GL[k]+'</p><button class="btn ghost" data-act="closedefn">Got it</button>';
  d.hidden=false;clearTimeout(showDefn.t);showDefn.t=setTimeout(()=>{d.hidden=true;},12000);
}

/* ---------- actions ---------- */
const acts={
  home(){if(run&&!run.done&&view==='play'){return;}view='title';run=null;render();},
  start(){
    const v=($('#nm').value||'').trim()||'Advisor';
    if(S.name!==v&&Object.keys(S.prog).length){S=Object.assign(fresh(),{settings:S.settings});}
    S.name=v;save();view='hub';render();
  },
  newplayer(){S=Object.assign(fresh(),{settings:S.settings});save();view='title';run=null;closeModal();render();},
  tgbig(a,el){S.settings.big=el.checked;save();applyTheme();},
  tgtts(a,el){S.settings.tts=el.checked;save();},
  tgunlock(a,el){S.settings.unlock=el.checked;save();if(view==='hub')render();},
  tgunlock2(){S.settings.unlock=!S.settings.unlock;save();openModal('teacher');if(view==='hub')render();},
  modal(k){openModal(k);},
  close(){closeModal();},
  closedefn(){$('#defn').hidden=true;},
  open(i){
    i=+i;if(!unlocked(i)){toast('Finish the chapter before this one first.');return;}
    const old=S.prog[i];
    run={ch:i,i:0,ok:0,total:0,fav:0,missed:[],done:false};view='play';render();
  },
  leave(){view='hub';run=null;render();},
  s(a,el){cur.on(a,el);},
  copysum(){
    const t=$('#sumtxt');t.select();
    try{navigator.clipboard.writeText(t.value).then(()=>{$('#tmsg').textContent='Copied.';},()=>{$('#tmsg').textContent='Press Ctrl+C (or Cmd+C) to copy the selected text.';});}
    catch(e){$('#tmsg').textContent='Press Ctrl+C (or Cmd+C) to copy the selected text.';}
  },
  clearboard(el){
    const m=$('#tmsg');
    if(!acts._c){acts._c=1;m.innerHTML='Tap “Clear class board” again to confirm.';setTimeout(()=>{acts._c=0;},4000);return;}
    acts._c=0;board=[];saveBoard();m.textContent='Class board cleared.';
  }
};
document.addEventListener('click',e=>{
  const term=e.target.closest('.term');if(term){showDefn(term.dataset.term);return;}
  const t=e.target.closest('[data-act]');
  if(t&&acts[t.dataset.act]){
    if(t.tagName==='INPUT'&&t.type==='checkbox'){acts[t.dataset.act](t.dataset.arg,t,e);return;}
    acts[t.dataset.act](t.dataset.arg,t,e);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else $('#defn').hidden=true;}
  if(e.key==='Enter'&&e.target.id==='nm'){acts.start();}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

function render(){
  if(view==='title')titleView();else if(view==='hub')hubView();else playView();
  updateMeter();window.scrollTo(0,0);
}
$('#brandrose').innerHTML=rose(30);
applyTheme();render();
})();
</script>
